# Copiar a la RAÍZ del monorepo encuesta-sorteo:
#   .github/workflows/deploy-leads.yml
#
# Deploy solo del CRM cuando cambia leads/** (no redeploya la landing).

name: Deploy VPS (Leads CRM)

on:
  push:
    branches: [main]
    paths:
      - 'leads/**'
      - '.github/workflows/deploy-leads.yml'
  workflow_dispatch:

concurrency:
  group: deploy-leads-crm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads
    steps:
      - name: Deploy leads via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            MONOREPO_ROOT="${MONOREPO_ROOT:-/opt/encuesta-landingqr}"
            cd "$MONOREPO_ROOT"
            git config --global --add safe.directory "$MONOREPO_ROOT" 2>/dev/null || true
            git checkout -f main 2>/dev/null || git checkout -fB main origin/main
            git fetch origin main
            git reset --hard origin/main
            test -f leads/deploy/deploy-vps-docker.sh
            chmod +x leads/deploy/deploy-vps-docker.sh
            export MONOREPO_ROOT SKIP_MONOREPO_GIT_PULL=1
            bash leads/deploy/deploy-vps-docker.sh

      # Prueba desde Internet (no solo desde el VPS): si falla, el deploy queda rojo.
      - name: Verificar URL pública del CRM
        run: |
          set -euo pipefail
          URL="https://www.miprimercasafsa-sorteo.com/leads/api/health/live"
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /tmp/leads-health.json -w '%{http_code}' --max-time 25 "$URL" || echo "000")
            echo "Intento $i: HTTP $code"
            if [[ "$code" == "200" ]] && grep -q '"ok":true' /tmp/leads-health.json 2>/dev/null; then
              cat /tmp/leads-health.json
              echo "OK — CRM accesible en producción"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: $URL no respondió OK tras deploy"
          exit 1

      - name: Notify Slack (optional)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ CRM Leads desplegado (monorepo, carpeta leads/)"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
