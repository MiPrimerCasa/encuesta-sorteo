# Fragmento Traefik — monorepo encuesta-sorteo
# Ruta: /leads en el dominio principal (mismo que la encuesta)
#
#   ./leads/deploy/deploy-vps-docker.sh

services:
  seguimiento-leads:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${LEADS_VITE_BASE:-/leads/}
    image: seguimiento-leads:latest
    container_name: seguimiento-leads
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      - ./data:/app/data
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      # Router: /leads en el dominio principal
      - "traefik.http.routers.leadssecure.rule=Host(`www.miprimercasafsa-sorteo.com`) && PathPrefix(`/leads`)"
      - "traefik.http.routers.leadssecure.entrypoints=websecure"
      - "traefik.http.routers.leadssecure.tls=true"
      - "traefik.http.routers.leadssecure.tls.certresolver=myhttpchallenge"
      - "traefik.http.routers.leadssecure.service=leadssvc"
      - "traefik.http.routers.leadssecure.middlewares=leadscompress@docker"
      - "traefik.http.middlewares.leadscompress.compress=true"
      - "traefik.http.services.leadssvc.loadbalancer.server.port=3001"

networks:
  root_default:
    external: true
