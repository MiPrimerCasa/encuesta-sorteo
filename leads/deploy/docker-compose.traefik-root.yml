# Fragmento Traefik — monorepo: --project-directory /opt/encuesta-landingqr/leads
#
#   ./leads/deploy/deploy-vps-docker.sh
#   # o manualmente:
#   docker compose --project-directory /opt/encuesta-landingqr/leads \
#     -f /root/docker-compose.yml \
#     -f deploy/docker-compose.traefik-root.yml \
#     up -d --build seguimiento-leads

services:
  seguimiento-leads:
    build:
      context: .
      dockerfile: Dockerfile
    image: seguimiento-leads:latest
    container_name: seguimiento-leads
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      - ./data:/app/data
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.leadssecure.rule=Host(`${LEADS_HOST}`)
      - traefik.http.routers.leadssecure.entrypoints=websecure
      - traefik.http.routers.leadssecure.tls=true
      - traefik.http.routers.leadssecure.tls.certresolver=myhttpchallenge
      - traefik.http.routers.leadssecure.service=leadssvc
      - traefik.http.routers.leadssecure.middlewares=leadscompress@docker
      - traefik.http.middlewares.leadscompress.compress=true
      - traefik.http.services.leadssvc.loadbalancer.server.port=3001

networks:
  root_default:
    external: true
