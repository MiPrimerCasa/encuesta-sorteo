# Copiar a la RAÍZ del monorepo encuesta-sorteo:
#   .github/workflows/deploy-leads.yml
#
# Deploy solo del CRM cuando cambia leads/** (no redeploya la landing).

name: Deploy VPS (Leads CRM)

on:
  push:
    branches: [main]
    paths:
      - 'leads/**'
      - '.github/workflows/deploy-leads.yml'
  workflow_dispatch:

concurrency:
  group: deploy-leads-crm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy leads via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            MONOREPO_ROOT="${MONOREPO_ROOT:-/opt/encuesta-landingqr}"
            cd "$MONOREPO_ROOT"
            git fetch origin main
            git reset --hard origin/main
            test -d leads/deploy/deploy-vps-docker.sh
            chmod +x leads/deploy/deploy-vps-docker.sh
            MONOREPO_ROOT="$MONOREPO_ROOT" bash leads/deploy/deploy-vps-docker.sh

      - name: Notify Slack (optional)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ CRM Leads desplegado (monorepo, carpeta leads/)"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
