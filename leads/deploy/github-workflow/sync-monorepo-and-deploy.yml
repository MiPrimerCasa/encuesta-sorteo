# Copiar a la RAÍZ del repo SISTEMA_SEGUIMIENTO_LEADS:
#   .github/workflows/sync-monorepo-and-deploy.yml
#
# Al mergear en main: sincroniza → encuesta-sorteo/leads/ → deploy VPS /leads
#
# Secrets en este repo (Settings → Secrets → Actions):
#   MONOREPO_PUSH_TOKEN  — PAT con write en MiPrimerCasa/encuesta-sorteo
#   VPS_HOST, VPS_USER, VPS_SSH_KEY — mismos que encuesta-sorteo

name: Sync monorepo y deploy producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-leads-monorepo-production
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads

    steps:
      - name: Checkout CRM (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout monorepo encuesta-sorteo
        uses: actions/checkout@v4
        with:
          repository: MiPrimerCasa/encuesta-sorteo
          token: ${{ secrets.MONOREPO_PUSH_TOKEN }}
          path: encuesta-sorteo
          fetch-depth: 0

      - name: Sincronizar código a leads/
        run: |
          chmod +x scripts/sync-to-monorepo.sh
          bash scripts/sync-to-monorepo.sh . encuesta-sorteo

      - name: Commit y push en monorepo
        id: monorepo_push
        working-directory: encuesta-sorteo
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add leads/
          if git diff --staged --quiet; then
            echo "Sin cambios en leads/ respecto al monorepo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            SHORT="${SRC_SHA:0:7}"
            git commit -m "chore(leads): sync desde SISTEMA_SEGUIMIENTO_LEADS@${SHORT}

          ${SRC_MSG}"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy leads en VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            MONOREPO_ROOT="${MONOREPO_ROOT:-/opt/encuesta-landingqr}"
            cd "$MONOREPO_ROOT"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/ensure-leads-env.sh leads/deploy/deploy-vps-docker.sh
            MONOREPO_ROOT="$MONOREPO_ROOT" bash deploy/ensure-leads-env.sh || true
            MONOREPO_ROOT="$MONOREPO_ROOT" bash leads/deploy/deploy-vps-docker.sh

      - name: Resumen
        if: always()
        run: |
          echo "## Sync + deploy CRM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo origen | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Monorepo | [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cambios en leads/ | ${{ steps.monorepo_push.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://www.miprimercasafsa-sorteo.com/leads |" >> "$GITHUB_STEP_SUMMARY"
